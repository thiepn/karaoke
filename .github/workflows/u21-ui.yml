name: ROOMTONE U21 Actual Local-HTTP Offline & Focus Evidence (NO_GO)
on:
  push:
    branches:
      - test/u21-actual-http-offline-focus
  pull_request:
    branches:
      - test/u20-modal-history-visibility-diagnostics
permissions:
  contents: read
jobs:
  chromium:
    name: U21 exact-head offline local origin and original browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actual source SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact U20 parent and byte-freeze ALL inherited files
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          parent='66b9406e247c13dfc2def70c22a2f765bb1b353f'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'],check=False).returncode==0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'.github/workflows/u21-ui.yml',
                   'tests/u21_offline_focus.py','docs/U21_OFFLINE_FOCUS_EVIDENCE.md'}
          assert {'.github/workflows/u21-ui.yml','tests/u21_offline_focus.py'}<=changed<=allowed,changed
          prior=subprocess.check_output(['git','ls-tree','-r','--name-only',parent],text=True).splitlines()
          for path in prior:
              assert Path(path).is_file(),f'inherited file missing: {path}'
              assert Path(path).read_bytes()==subprocess.check_output(
                  ['git','show',f'{parent}:{path}']),f'inherited source mutated: {path}'
          print('PASS source-only U20 child; all inherited source, original U8/U16 and app bytes intact')
          PY
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical pinned Chromium test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Genuine isolated loopback HTTP offline network and focus checks
        run: python tests/u21_offline_focus.py
      - name: Requalify inherited original U3 through U20 Chromium suites
        shell: bash
        run: |
          set -euo pipefail
          for phase in u3 u4 u5 u6 u7 u11 u12 u13 u14; do
            python "tests/$phase"_smoke.py
          done
          python tests/u15_reconciliation_smoke.py
          python tests/u18_smoke.py
          python tests/u19_smoke.py
          python tests/u20_smoke.py
      - name: Independently verify all per-PNG original source manifests
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11 u12 u13 u14 u15 u18 u19 u20 u21; do
            case "$phase" in
              u4) count=12 ;;
              u5) count=15 ;;
              u6|u7|u12|u14|u19|u20|u21) count=16 ;;
              u11) count=14 ;;
              u13) count=12 ;;
              u15|u18) count=8 ;;
            esac
            test "$(find "$phase-evidence" -maxdepth 1 -name "$phase-*.png" | wc -l)" -eq "$count"
            (cd "$phase-evidence" && sha256sum -c sha256.txt)
          done
      - name: Preserve immutable U8/U16 owner evidence and release NO_GO
        shell: bash
        run: |
          set -euo pipefail
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json >/tmp/u21-u8.json
          python scripts/u16_validate_private_witness.py docs/evidence/U16_HU7_LOCAL_INTAKE.template.json >/tmp/u21-u16.json
          python - <<'PY'
          import json
          u8=json.load(open('/tmp/u21-u8.json'))
          u16=json.load(open('/tmp/u21-u16.json'))
          assert u8['claimed_observed']==0 and u8['release']=='NO_GO'
          assert u8['human_truth_verified'] is False
          assert list(u8['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          assert u16['reported_test_ids_unverified']==[] and u16['release']=='NO_GO'
          assert u16['human_truth_verified'] is False and u16['owner_approval_verified'] is False
          print('PASS 7 HU7 NOT_TESTED and HU7-08 NOT_GIVEN; source browser evidence never release approval')
          PY
      - name: Retain ALL original synthetic PNG evidence, even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u21-original-local-http-browser-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            u21-evidence/
            u20-evidence/
            u19-evidence/
            u18-evidence/
            u15-evidence/
            u14-evidence/
            u13-evidence/
            u12-evidence/
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
