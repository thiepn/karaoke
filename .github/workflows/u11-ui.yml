name: ROOMTONE U11 After Hours UI Iteration (NO_GO)
on:
  push:
    branches:
      - feat/u11-after-hours-ui-polish
  pull_request:
    branches:
      - docs/u10-witness-chronology-guard
permissions:
  contents: read
jobs:
  visual:
    name: Exact-head U11 source-only UI and Chromium screenshot checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify U10 parent and preserve all player/audio/human gates
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          parent='323100e83340ccfae2bb4c599d10705fc8499d21'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD']).returncode == 0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'index.html','u11.css','tests/u11_smoke.py',
                   '.github/workflows/u11-ui.yml','docs/U11_VISUAL_ITERATION.md'}
          assert changed==allowed,changed
          original=subprocess.check_output(['git','show',parent+':index.html'],text=True)
          current=Path('index.html').read_text()
          assert current.replace('  <link rel="stylesheet" href="u11.css">\n','')==original, \
              'index.html changed beyond one U11 stylesheet link'
          assert current.count('href="u11.css"')==1
          assert 'src="u11.js"' not in current
          for n in ('u2','u3','u4','u5','u6','u7'):
              assert current.count(f'href="{n}.css"')==1
              assert current.count(f'src="{n}.js"')==1
              for ext in ('css','js'):
                  path=f'{n}.{ext}'
                  assert Path(path).read_bytes()==subprocess.check_output(
                      ['git','show',f'{parent}:{path}']),f'{path} changed'
          for path in ('docs/evidence/U8_HU7_ACCEPTANCE.template.json',
                       'scripts/u8_validate_evidence.py',
                       'tests/u8_evidence_intake_test.py'):
              assert Path(path).read_bytes()==subprocess.check_output(
                  ['git','show',f'{parent}:{path}']),f'{path} changed'
          print('PASS U10 exact ancestry; U11 stylesheet-only HTML; player/UI ancestors/evidence frozen',flush=True)
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic Chromium tests only
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Preserve inherited U3 keyboard/UI regressions
        run: python tests/u3_smoke.py
      - name: Preserve inherited U4 keyboard/recording interface regressions
        run: python tests/u4_smoke.py
      - name: Preserve inherited U5 visual/song browser regressions
        run: python tests/u5_smoke.py
      - name: Preserve inherited U6 accessibility/filter regressions
        run: python tests/u6_smoke.py
      - name: Preserve inherited U7 Stage/safety layout regressions
        run: python tests/u7_smoke.py
      - name: Run new U11 responsive visual and control geometry suite
        run: python tests/u11_smoke.py
      - name: Verify original visual screenshot hashes
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11; do
            case "$phase" in
              u4) expected=12 ;;
              u5) expected=15 ;;
              u6|u7) expected=16 ;;
              u11) expected=14 ;;
            esac
            test "$(find "$phase-evidence" -maxdepth 1 -name "$phase-*.png" | wc -l)" -eq "$expected"
            (cd "$phase-evidence" && sha256sum --check sha256.txt)
          done
      - name: Verify human acceptance stays open and production NO_GO
        shell: bash
        run: |
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json \
            > /tmp/u11-human-gates.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/u11-human-gates.json'))
          assert data['claimed_observed']==0
          assert data['human_truth_verified'] is False
          assert data['release']=='NO_GO'
          assert list(data['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          print('PASS all human gates still untested/unapproved; production NO_GO')
          PY
      - name: Retain original Chromium images for visual review (not golden/owner testimony)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u11-original-chromium-visuals
          path: |
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
          if-no-files-found: warn
          retention-days: 30
