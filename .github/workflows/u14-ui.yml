name: ROOMTONE U14 Modal Accessibility & Responsive Evidence (NO_GO)
on:
  push:
    branches:
      - feat/u14-focus-modal-accessibility
  pull_request:
    branches:
      - feat/u13-focus-library-evidence-hardening
permissions:
  contents: read
jobs:
  visual:
    name: U14 exact-head accessibility and original screenshot gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout actual trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify U13 exact ancestry and only U14 scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          parent='d989d869d4ed4071469bb8ba2e4c9d54d91d7977'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'],check=False).returncode == 0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'index.html','u14.js','tests/u14_smoke.py',
                   '.github/workflows/u14-ui.yml','docs/U14_ACCESSIBILITY_EVIDENCE.md'}
          assert changed == allowed,changed
          original=subprocess.check_output(['git','show',f'{parent}:index.html'],text=True)
          html=Path('index.html').read_text()
          assert html.replace('<script defer src="u14.js"></script>\n','') == original
          assert html.count('src="u14.js"') == 1
          for n in ('u2','u3','u4','u5','u6','u7','u11','u12','u13'):
              p=f'{n}.css'
              assert Path(p).read_bytes()==subprocess.check_output(['git','show',f'{parent}:{p}'])
              assert html.count(f'href="{p}"')==1
              if n not in ('u11','u12','u13'):
                  p=f'{n}.js'
                  assert Path(p).read_bytes()==subprocess.check_output(['git','show',f'{parent}:{p}'])
                  assert html.count(f'src="{p}"')==1
          for p in ('scripts/u8_validate_evidence.py','tests/u8_evidence_intake_test.py',
                    'docs/evidence/U8_HU7_ACCEPTANCE.template.json'):
              assert Path(p).read_bytes()==subprocess.check_output(['git','show',f'{parent}:{p}'])
          print('PASS exact U13 ancestry; inherited JS/CSS, playback/data and human evidence frozen')
          PY
      - name: Setup Python for synthetic Chromium
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inherited U3 keyboard and workspace
        run: python tests/u3_smoke.py
      - name: Inherited U4 recording controls
        run: python tests/u4_smoke.py
      - name: Inherited U5 Stage and Songs
        run: python tests/u5_smoke.py
      - name: Inherited U6 filter semantics
        run: python tests/u6_smoke.py
      - name: Inherited U7 safety and focus
        run: python tests/u7_smoke.py
      - name: Inherited U11 responsive Songs Studio
        run: python tests/u11_smoke.py
      - name: Inherited U12 fullscreen geometry
        run: python tests/u12_smoke.py
      - name: Inherited U13 viewport and keyboard coverage
        run: python tests/u13_smoke.py
      - name: New U14 modal AX and keyboard focus containment
        run: python tests/u14_smoke.py
      - name: Verify unmodified original screenshot SHA256 manifests
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11 u12 u13 u14; do
            case "$phase" in
              u4) count=12 ;;
              u5) count=15 ;;
              u6|u7|u12|u14) count=16 ;;
              u11) count=14 ;;
              u13) count=12 ;;
            esac
            test "$(find "$phase-evidence" -maxdepth 1 -name "$phase-*.png" | wc -l)" -eq "$count"
            (cd "$phase-evidence" && sha256sum --check sha256.txt)
          done
      - name: Verify owner acceptance still NOT_TESTED and NO_GO
        shell: bash
        run: |
          set -euo pipefail
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json > /tmp/u14-gates.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/u14-gates.json'))
          assert x['claimed_observed']==0 and x['human_truth_verified'] is False
          assert x['release']=='NO_GO'
          assert list(x['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          print('PASS U14 is synthetic only; 7 NOT_TESTED, 1 NOT_GIVEN; production NO_GO')
          PY
      - name: Retain original unapproved Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u14-original-chromium-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            u14-evidence/
            u13-evidence/
            u12-evidence/
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
