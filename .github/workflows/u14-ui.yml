name: ROOMTONE U14 Focus Keyboard Containment (NO_GO)
on:
  push:
    branches:
      - feat/u14-focus-keyboard-containment
  pull_request:
    branches:
      - feat/u13-focus-library-evidence-hardening
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact U13 ancestry and protected source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import subprocess
          parent='d989d869d4ed4071469bb8ba2e4c9d54d91d7977'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD']).returncode==0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'index.html','u14.js','tests/u14_smoke.py',
                   '.github/workflows/u14-ui.yml','docs/U14_VIEWPORT_A11Y.md'}
          assert changed<=allowed,changed
          print('PASS exact U13 base; U14 permitted scope')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prove/verify native Tab containment in fullscreen
        run: python tests/u14_smoke.py
      - name: Inherited U3 through U13 synthetic browser regressions
        run: |
          python tests/u3_smoke.py
          python tests/u4_smoke.py
          python tests/u5_smoke.py
          python tests/u6_smoke.py
          python tests/u7_smoke.py
          python tests/u11_smoke.py
          python tests/u12_smoke.py
          python tests/u13_smoke.py
      - name: Verify inherited per-PNG SHA256
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11 u12 u13; do
            (cd "$phase-evidence" && sha256sum --check sha256.txt)
          done
      - name: Human acceptance and production NO_GO preserved
        shell: bash
        run: |
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json > /tmp/u14.json
          python - <<'PY'
          import json
          v=json.load(open('/tmp/u14.json'))
          assert v['claimed_observed']==0
          assert v['human_truth_verified'] is False and v['release']=='NO_GO'
          assert list(v['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          print('PASS 7 NOT_TESTED, 1 NOT_GIVEN and NO_GO')
          PY
      - name: Retain inherited original Chromium screenshots, never goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u14-inherited-original-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            u13-evidence/
            u12-evidence/
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
