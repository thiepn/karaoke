name: ROOMTONE U20 Modal History & Visibility Source Qualification (NO_GO)
on:
  push:
    branches:
      - test/u20-modal-history-visibility-diagnostics
  pull_request:
    branches:
      - feat/u19-cross-view-focus-recovery
permissions:
  contents: read
jobs:
  browser:
    name: U20 exact-source Chromium browser lifecycle & historical evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger SHA without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert qualified U19 ancestry and additive test/docs/workflow-only source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          parent='c9690d35a1087e2c4a967dfc5cc953f097ddbff2'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'],check=False).returncode==0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          assert changed<={
              'tests/u20_smoke.py','.github/workflows/u20-ui.yml',
              'docs/U20_MODAL_HISTORY_QUALIFICATION.md'},changed
          assert {'tests/u20_smoke.py','.github/workflows/u20-ui.yml'}<=changed
          prior=subprocess.check_output(['git','ls-tree','-r','--name-only',parent],text=True).splitlines()
          for path in prior:
              assert Path(path).is_file(),f'previous file missing: {path}'
              assert Path(path).read_bytes()==subprocess.check_output(
                  ['git','show',f'{parent}:{path}']),f'prior file mutated: {path}'
          print('PASS all inherited U19 application/source and original U8/U16 templates bytewise frozen')
          PY
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pinned Chromium test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: U20 actual synthetic Chromium modal history and visibility
        run: python tests/u20_smoke.py
      - name: Inherited actual U3 to U19 browser regressions
        shell: bash
        run: |
          set -euo pipefail
          for id in u3 u4 u5 u6 u7 u11 u12 u13 u14; do
            python "tests/$id"_smoke.py
          done
          python tests/u15_reconciliation_smoke.py
          python tests/u18_smoke.py
          python tests/u19_smoke.py
      - name: Independent original screenshot SHA256 manifests
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11 u12 u13 u14 u15 u18 u19 u20; do
            case "$phase" in
              u4) count=12 ;;
              u5) count=15 ;;
              u6|u7|u12|u14|u19|u20) count=16 ;;
              u11) count=14 ;;
              u13) count=12 ;;
              u15|u18) count=8 ;;
            esac
            test "$(find "$phase-evidence" -maxdepth 1 -name "$phase-*.png" | wc -l)" -eq "$count"
            (cd "$phase-evidence" && sha256sum -c sha256.txt)
          done
      - name: Assert original U8 and U16 blank witness gates and production NO_GO
        shell: bash
        run: |
          set -euo pipefail
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json >/tmp/u20-u8.json
          python scripts/u16_validate_private_witness.py docs/evidence/U16_HU7_LOCAL_INTAKE.template.json >/tmp/u20-u16.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/u20-u8.json'));b=json.load(open('/tmp/u20-u16.json'))
          assert a['claimed_observed']==0 and a['release']=='NO_GO' and a['human_truth_verified'] is False
          assert list(a['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          assert b['reported_test_ids_unverified']==[] and b['release']=='NO_GO'
          assert b['human_truth_verified'] is False and b['owner_approval_verified'] is False
          print('PASS no authentic HU7 evidence, human NOT_TESTED and release NO_GO')
          PY
      - name: Retain original synthetic screenshot evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u20-original-chromium-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            u20-evidence/
            u19-evidence/
            u18-evidence/
            u15-evidence/
            u14-evidence/
            u13-evidence/
            u12-evidence/
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
