name: ROOMTONE A1 Audio Optimization Chromium

on:
  push:
    branches:
      - feat/audio-optimization-h1-calibration
  pull_request:
    branches:
      - feat/u4-after-hours-release-candidate

permissions:
  contents: read

jobs:
  chromium:
    name: Exact-head original regression and audio setup
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source ref and additive A1 files
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for name in ('u2','u3','u4'):
              assert html.count(f'src="{name}.js"')==1
          assert html.count('src="audio-opt.js"')==1
          assert html.count('href="audio-opt.css"')==1
          for name in ('audio-opt.js','audio-opt.css','tests/audio_opt_smoke.py','docs/audio-hardware-acceptance.md'):
              assert Path(name).is_file(),name
          print('PASS exact-head additive assets')
          PY
      - name: Install Python and Chromium
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run inherited U3 Chromium regression
        run: python tests/u3_smoke.py
      - name: Run inherited U4 Chromium regression
        run: python tests/u4_smoke.py
      - name: Run A1 profile and calibration browser tests
        run: python tests/audio_opt_smoke.py
      - name: Run A1R local HTTP route switching and fake-device checks
        run: python tests/audio_route_smoke.py
      - name: Check unchanged original U4 evidence and A1 evidence
        run: |
          test "$(find u4-evidence -maxdepth 1 -name 'u4-*.png' | wc -l)" -eq 12
          (cd u4-evidence && sha256sum --check sha256.txt)
          test "$(find audio-opt-evidence -maxdepth 1 -name 'setup-*.png' | wc -l)" -eq 2
          (cd audio-opt-evidence && sha256sum --check sha256.txt)
      - name: Retain inherited and A1 original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-a1-original-chromium-evidence
          path: |
            u4-evidence/
            u3-*.png
            audio-opt-evidence/
          if-no-files-found: warn
          retention-days: 30
