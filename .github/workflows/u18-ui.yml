name: ROOMTONE U18 Source-Only Modal Route Regression (NO_GO)
on:
  push:
    branches:
      - feat/u18-modal-route-focus-reproduction
  pull_request:
    branches:
      - docs/u16-private-owner-witness-recovery
permissions:
  contents: read
jobs:
  browser:
    name: U18 exact-head modal exit and destination focus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actual trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock unchanged U16 source and exact U18 allowlist
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          parent='91b3379e43847f36073bbc31a8317ee7b72cdb32'
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD'],check=False).returncode==0
          changed=set(subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines())
          allowed={'.github/workflows/u18-ui.yml','tests/u18_smoke.py',
                   'docs/U18_REGRESSION_EVIDENCE.md','index.html','u18.js'}
          assert {'tests/u18_smoke.py','.github/workflows/u18-ui.yml'}<=changed,changed
          assert changed <= allowed,changed
          for path in ['u14.js','u7.js','u6.js','u5.js','u4.js','u3.js','u2.js',
                       'scripts/u8_validate_evidence.py','scripts/u16_validate_private_witness.py',
                       'docs/evidence/U8_HU7_ACCEPTANCE.template.json',
                       'docs/evidence/U16_HU7_LOCAL_INTAKE.template.json']:
              assert Path(path).read_bytes()==subprocess.check_output(['git','show',f'{parent}:{path}'])
          for n in ('u2','u3','u4','u5','u6','u7','u11','u12','u13'):
              path=n+'.css'
              assert Path(path).read_bytes()==subprocess.check_output(['git','show',f'{parent}:{path}'])
          html=Path('index.html').read_text()
          old=subprocess.check_output(['git','show',f'{parent}:index.html'],text=True)
          if html!=old:
              assert html.replace('  <script defer src="u18.js"></script>\n','')==old
              assert html.count('src="u18.js"')==1
          print('PASS unchanged inherited app code and human data, isolated U18 route layer only')
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Actual U18 modal exit, Songs destination and Chromium AX
        run: python tests/u18_smoke.py
      - name: Requalify inherited U3 through U15 original browser behavior
        run: |
          python tests/u3_smoke.py
          python tests/u4_smoke.py
          python tests/u5_smoke.py
          python tests/u6_smoke.py
          python tests/u7_smoke.py
          python tests/u11_smoke.py
          python tests/u12_smoke.py
          python tests/u13_smoke.py
          python tests/u14_smoke.py
          python tests/u15_reconciliation_smoke.py
      - name: Verify original per-PNG image SHA256 manifests
        shell: bash
        run: |
          set -euo pipefail
          for phase in u4 u5 u6 u7 u11 u12 u13 u14 u15 u18; do
            case "$phase" in
              u4) count=12 ;;
              u5) count=15 ;;
              u6|u7|u12|u14) count=16 ;;
              u11) count=14 ;;
              u13) count=12 ;;
              u15|u18) count=8 ;;
            esac
            test "$(find "$phase-evidence" -maxdepth 1 -name "$phase-*.png" | wc -l)" -eq "$count"
            (cd "$phase-evidence" && sha256sum -c sha256.txt)
          done
      - name: Preserve U8 and U16 owner gates and production NO_GO
        shell: bash
        run: |
          set -euo pipefail
          python scripts/u8_validate_evidence.py docs/evidence/U8_HU7_ACCEPTANCE.template.json > /tmp/u18-u8.json
          python scripts/u16_validate_private_witness.py docs/evidence/U16_HU7_LOCAL_INTAKE.template.json > /tmp/u18-u16.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/u18-u8.json'));b=json.load(open('/tmp/u18-u16.json'))
          assert a['claimed_observed']==0 and a['release']=='NO_GO' and not a['human_truth_verified']
          assert list(a['statuses'].values())==['NOT_TESTED']*7+['NOT_GIVEN']
          assert b['reported_test_ids_unverified']==[] and b['release']=='NO_GO'
          assert not b['human_truth_verified'] and not b['owner_approval_verified']
          print('PASS seven NOT_TESTED, HU7-08 NOT_GIVEN, real devices NOT_TESTED and NO_GO')
          PY
      - name: Retain original synthetic PNGs even if diagnostic fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-u18-original-chromium-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            u18-evidence/
            u15-evidence/
            u14-evidence/
            u13-evidence/
            u12-evidence/
            u11-evidence/
            u7-evidence/
            u6-evidence/
            u5-evidence/
            u4-evidence/
            u3-*.png
